<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CitaFácil - Agendar Cita</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f6f9; }
        .contenedor { max-width: 450px; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        label { display: block; margin-top: 12px; font-weight: bold; }
        input, select { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; }
        button { margin-top: 20px; width: 100%; padding: 10px; background-color: #0056b3; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #004494; }
        .enlace { display: block; text-align: center; margin-top: 15px; color: #0056b3; text-decoration: none; }
    </style>
</head>
<body>
    <div class="contenedor">
        <h2>Agendar Nueva Cita (Web)</h2>
        <!-- Formulario que envía los datos mediante POST al Servlet -->
        <form action="CitaServlet" method="POST">
            <label for="idUsuario">ID Usuario:</label>
            <input type="number" id="idUsuario" name="idUsuario" required>

            <label for="idServicio">ID Servicio:</label>
            <input type="number" id="idServicio" name="idServicio" required>

            <label for="idHorario">ID Horario:</label>
            <input type="number" id="idHorario" name="idHorario" required>

            <label for="estado">Estado de la Cita:</label>
            <select id="estado" name="estado">
                <option value="confirmada">Confirmada</option>
                <option value="pendiente">Pendiente</option>
            </select>

            <button type="submit">Registrar Cita</button>
        </form>

        <!-- Enlace que consulta las citas usando GET -->
        <a class="enlace" href="CitaServlet">Ver listado de citas registradas</a>
    </div>
</body>
</html>
